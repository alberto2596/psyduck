<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Psyduck | Quantum Metric</title>
  <style>
    :root {
      --yellow: #facc15;
      --yellow-soft: #fef9c3;
      --purple-sheet: #d9d2e9;
      --dark: #0f172a;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --muted: #64748b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--dark);
      margin: 0;
      padding: 1rem;
      font-size: 0.92rem;
    }
    .container { max-width: 1150px; margin: 0 auto; }

    /* Barra superior compacta todo-en-uno */
    .topbar {
      background: var(--dark);
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-bottom: 3px solid var(--yellow);
      margin-bottom: 0.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .duty-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }
    .pill-active {
      background: var(--yellow);
      color: var(--dark);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-weight: 700;
    }
    .pill-next {
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }

    /* Desplegable discreto para el calendario y censo */
    details.roster-drawer {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.4rem 0.85rem;
      margin-bottom: 1.25rem;
      font-size: 0.8rem;
    }
    details.roster-drawer summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    details.roster-drawer summary:hover { color: var(--dark); }
    .drawer-content {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      overflow-x: auto;
    }
    .team-inline {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .mini-tag {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .mini-tag.on-duty {
      background: var(--yellow-soft);
      border-color: #eab308;
    }

    /* Tabla compacta dentro del desplegable */
    table.excel-mirror {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.76rem;
    }
    .excel-mirror th {
      background: var(--purple-sheet);
      color: var(--dark);
      padding: 0.35rem 0.6rem;
      border: 1px solid #cbd5e1;
      white-space: nowrap;
    }
    .excel-mirror td {
      padding: 0.4rem 0.6rem;
      border: 1px solid #cbd5e1;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
    }
    .excel-mirror .col-actual {
      background: var(--yellow-soft) !important;
      border: 2px solid #eab308;
    }

    /* Zona principal para el contenido importante */
    .main-workspace {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      min-height: 420px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. BARRA SUPERIOR ULTRA-COMPACTA -->
    <header class="topbar">
      <div class="brand">
        <span>🦆</span>
        <h1>Portal Psyduck — Quantum Metric</h1>
      </div>

      <div class="duty-bar">
        <span class="pill-active">
          En turno: <span id="current-psyduck">Cargando...</span>
          <small id="current-period" style="font-weight:400; opacity:0.85;"></small>
        </span>
        <span class="pill-next">
          Siguiente: <strong id="next-psyduck">-</strong>
        </span>
      </div>
    </header>

    <!-- 2. DESPLEGABLE OCULTO (Solo se abre si alguien quiere consultar el Excel completo) -->
    <details class="roster-drawer" id="drawer">
      <summary>
        <span>📅 Ver cuadrante completo de semanas y equipo (<span id="status-sync">sincronizando...</span>)</span>
        <a href="https://docs.google.com/spreadsheets/d/1FdQphS9U1p9VbDQRXsBssSVe8D5eH9d-01R6CE065kk/edit?gid=0#gid=0" target="_blank" style="color:#107c41; text-decoration:none;">Abrir Sheets ↗</a>
      </summary>
      <div class="drawer-content">
        <div class="team-inline" id="team-grid"><strong>Equipo:</strong></div>
        <table class="excel-mirror">
          <thead><tr id="row-dates"><th>Semana</th></tr></thead>
          <tbody><tr id="row-names"><td style="background:#d9d2e9;">Psyduck</td></tr></tbody>
        </table>
      </div>
    </details>

    <!-- ==================================================================== -->
    <!-- 3. CONTENIDO PRINCIPAL DE LA PÁGINA (EL 90% DEL ESPACIO)             -->
    <!-- ==================================================================== -->
    <main class="main-workspace">
      <h2 style="margin-top:0;">🚀 Gestión de Releases — Quantum Metric</h2>
      <p style="color:var(--muted);">Aquí irá los bloques principales que definamos ahora.</p>
    </main>
  </div>

  <script>
    function cargarDatosPsyduck(datos) {
      document.getElementById("status-sync").textContent = "sincronizado";

      if (datos.turnoActual) {
        document.getElementById("current-psyduck").textContent = datos.turnoActual.persona;
        const fechas = datos.turnoActual.cabecera.match(/\((.*?)\)/);
        document.getElementById("current-period").textContent = fechas ? `(${fechas[1]})` : "";
      } else {
        document.getElementById("current-psyduck").textContent = "Sin turno hoy";
      }

      if (datos.proximoTurno) {
        document.getElementById("next-psyduck").textContent = datos.proximoTurno.persona;
      }

      const teamGrid = document.getElementById("team-grid");
      datos.miembros.forEach(nombre => {
        const esActivo = datos.turnoActual && datos.turnoActual.persona === nombre;
        const span = document.createElement("span");
        span.className = `mini-tag ${esActivo ? "on-duty" : ""}`;
        span.textContent = `${esActivo ? "🦆 " : ""}${nombre}`;
        teamGrid.appendChild(span);
      });

      const trDates = document.getElementById("row-dates");
      const trNames = document.getElementById("row-names");
      let thActual = null;

      datos.turnos.forEach(t => {
        const th = document.createElement("th");
        th.textContent = t.cabecera;
        if (t.esActual) { th.className = "col-actual"; thActual = th; }
        trDates.appendChild(th);

        const td = document.createElement("td");
        td.textContent = t.persona;
        if (t.esActual) td.className = "col-actual";
        trNames.appendChild(td);
      });

      // Hace auto-scroll a la semana actual cuando el usuario abre el desplegable
      document.getElementById("drawer").addEventListener("toggle", function() {
        if (this.open && thActual) {
          setTimeout(() => thActual.scrollIntoView({ behavior: "smooth", inline: "center" }), 100);
        }
      });
    }
  </script>

  <!-- PEGA AQUÍ DEBAJO LA URL DE TU APPS SCRIPT (terminada en /exec) -->
  <script src="https://script.google.com/macros/s/AKfycbxXbNrHBztvNgV3eeyEUmYYZwqSKTwz3-L24NiNDrz5FzXqiaACLUeB5Psvm2xMf5xe/exec"></script>

</body>
</html>
