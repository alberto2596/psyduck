<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Psyduck | Quantum Metric</title>
  <style>
    :root {
      --yellow: #facc15;
      --yellow-soft: #fef9c3;
      --purple-sheet: #d9d2e9;
      --dark: #0f172a;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --muted: #64748b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--dark);
      margin: 0;
      padding: 2rem 1rem;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    header {
      background: var(--dark);
      color: white;
      padding: 1.5rem 2rem;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 5px solid var(--yellow);
      margin-bottom: 2rem;
    }
    header h1 { margin: 0; font-size: 1.5rem; }
    .btn-sheet {
      background: #107c41;
      color: white;
      text-decoration: none;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Banner del turno actual */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .hero-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
    }
    .hero-card.active {
      background: var(--yellow-soft);
      border-color: var(--yellow);
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.25);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--dark);
      color: var(--yellow);
      margin-bottom: 0.5rem;
    }
    .badge.secondary {
      background: var(--border);
      color: var(--dark);
    }
    .big-name {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0.25rem 0;
    }
    .period-text {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0;
    }

    /* Tarjetas del equipo */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .member-pill {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      font-weight: 700;
    }
    .member-pill.on-duty {
      border-color: var(--yellow);
      background: var(--yellow-soft);
    }

    /* Línea temporal horizontal como el Excel */
    .timeline-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      overflow-x: auto;
    }
    table.excel-mirror {
      border-collapse: collapse;
      width: 100%;
      min-width: 650px;
      font-size: 0.88rem;
    }
    .excel-mirror th {
      background: var(--purple-sheet);
      color: var(--dark);
      padding: 0.65rem 0.85rem;
      border: 1px solid #cbd5e1;
      text-align: center;
      white-space: nowrap;
    }
    .excel-mirror td {
      padding: 0.75rem 0.85rem;
      border: 1px solid #cbd5e1;
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
    }
    .excel-mirror .col-actual {
      background: var(--yellow-soft) !important;
      border: 2px solid #eab308;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>🦆 Portal Psyduck — Quantum Metric</h1>
        <small id="status-sync">Conectando con Google Sheets...</small>
      </div>
      <a href="PEGA_AQUI_EL_LINK_DE_TU_GOOGLE_SHEETS" target="_blank" class="btn-sheet">
        📊 Abrir Google Sheets
      </a>
    </header>

    <!-- 1. Resumen de quién está de guardia hoy y quién va después -->
    <div class="hero-grid">
      <div class="hero-card active">
        <span class="badge">🦆 Psyduck Esta Semana</span>
        <p class="big-name" id="current-psyduck">Cargando...</p>
        <p class="period-text" id="current-period">Buscando fecha actual en el Excel...</p>
      </div>
      <div class="hero-card">
        <span class="badge secondary">⏭️ Siguiente Turno (Backup)</span>
        <p class="big-name" id="next-psyduck">-</p>
        <p class="period-text" id="next-period">-</p>
      </div>
    </div>

    <!-- 2. Censo de personas del equipo detectadas en el Excel -->
    <h2>👥 Equipo Psyduck</h2>
    <div class="team-grid" id="team-grid"></div>

    <!-- 3. Vista de cuadrante de semanas (igual que tu Excel pero resaltando la semana actual) -->
    <h2>📅 Cuadrante de Semanas (Sincronizado)</h2>
    <div class="timeline-wrapper">
      <table class="excel-mirror" id="schedule-table">
        <thead><tr id="row-dates"><th>Semana</th></tr></thead>
        <tbody><tr id="row-names"><td style="background:#d9d2e9;">Psyduck</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    // Esta función recibe automáticamente los datos desde tu Google Apps Script
    function cargarDatosPsyduck(datos) {
      document.getElementById("status-sync").textContent = 
        "Sincronizado en tiempo real con Google Sheets";

      // 1. Pintar Psyduck actual y siguiente
      if (datos.turnoActual) {
        document.getElementById("current-psyduck").textContent = datos.turnoActual.persona;
        document.getElementById("current-period").textContent = datos.turnoActual.cabecera;
      } else {
        document.getElementById("current-psyduck").textContent = "Sin turno activo hoy";
        document.getElementById("current-period").textContent = 
          "Añade la columna con las fechas de la semana actual en el Google Sheets.";
      }

      if (datos.proximoTurno) {
        document.getElementById("next-psyduck").textContent = datos.proximoTurno.persona;
        document.getElementById("next-period").textContent = datos.proximoTurno.cabecera;
      }

      // 2. Pintar las tarjetas de los miembros del equipo
      const teamGrid = document.getElementById("team-grid");
      datos.miembros.forEach(nombre => {
        const esActivo = datos.turnoActual && datos.turnoActual.persona === nombre;
        const div = document.createElement("div");
        div.className = `member-pill ${esActivo ? "on-duty" : ""}`;
        div.innerHTML = `${esActivo ? "🦆 " : ""}${nombre}`;
        teamGrid.appendChild(div);
      });

      // 3. Pintar la tabla horizontal y hacer scroll automático hasta la semana actual
      const trDates = document.getElementById("row-dates");
      const trNames = document.getElementById("row-names");

      datos.turnos.forEach((t, idx) => {
        const th = document.createElement("th");
        th.textContent = t.cabecera;
        if (t.esActual) th.className = "col-actual";
        trDates.appendChild(th);

        const td = document.createElement("td");
        td.textContent = t.persona;
        if (t.esActual) {
          td.className = "col-actual";
          setTimeout(() => th.scrollIntoView({ behavior: "smooth", inline: "center" }), 200);
        }
        trNames.appendChild(td);
      });
    }
  </script>

  <!-- ==================================================================== -->
  <!-- PEGA AQUÍ DEBAJO LA URL DE TU APPS SCRIPT (la que termina en /exec)  -->
  <!-- ==================================================================== -->
  <script src="https://script.google.com/macros/s/AKfycbxXbNrHBztvNgV3eeyEUmYYZwqSKTwz3-L24NiNDrz5FzXqiaACLUeB5Psvm2xMf5xe/exec"></script>

</body>
</html>
